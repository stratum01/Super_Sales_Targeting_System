version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: '%(asctime)s [%(levelname)s] %(name)s: %(message)s'

handlers:
  console:
    class: logging.StreamHandler
    level: INFO  # Change to DEBUG to see all debug messages
    formatter: standard
    stream: ext://sys.stdout

  file:
    class: logging.FileHandler
    level: DEBUG
    formatter: standard
    filename: app.log
    mode: a

loggers:
  sales_targeting:
    level: INFO  # Change to DEBUG to enable debug logging for sales targeting
    handlers: [console, file]
    propagate: false

  comparison_system:
    level: INFO  # Change to DEBUG to enable debug logging for comparison system
    handlers: [console, file]
    propagate: false